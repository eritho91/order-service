spring.datasource.url=jdbc:h2:mem:order_service_test_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/auth/jwks

product-service.base-url=http://localhost:8081

spring.rabbitmq.addresses=amqp://guest:guest@localhost:5672